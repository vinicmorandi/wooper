app = "wooper-server"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  CLIENT_ORIGIN = "https://wooper-demo.vercel.app,https://wooper.vercel.app"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250
